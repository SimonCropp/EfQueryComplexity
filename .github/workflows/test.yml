name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel in-progress runs if a new push lands on the same branch.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  test:
    # Windows only: the database tests run against SQL Server LocalDB, which exists nowhere else.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Fails here, loudly, if the image ever drops LocalDB, rather than as a timeout inside the
      # database tests. Starting the default instance also pays the one off service start, which is
      # slow and erratic on hosted runners.
      - name: Start LocalDB
        run: |
          sqllocaldb info
          sqllocaldb start MSSQLLocalDB

      # A plain build is also the pack step: ProjectDefaults sets GeneratePackageOnBuild for every
      # Release package project, so this produces ./nugets as a side effect.
      - name: Build
        run: dotnet build src --configuration Release

      - name: Test
        run: dotnet test --solution src/EfQueryComplexity.slnx --configuration Release --no-build --no-restore

      - name: Upload received on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: received
          path: '**/*.received.*'
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload packages
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: nugets/*.nupkg
          if-no-files-found: warn
          retention-days: 30
